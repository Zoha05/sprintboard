apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprintboard
  namespace: sprintboard
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: sprintboard
  template:
    metadata:
      labels:
        app: sprintboard
    spec:
      containers:
        - name: sprintboard
          image: sprintboard:latest        # built locally - see README
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: sprintboard-config }
            - secretRef: { name: sprintboard-secret }
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: sprintboard
  namespace: sprintboard
spec:
  selector:
    app: sprintboard
  ports:
    - port: 80
      targetPort: 3000
---
# Needs metrics-server (minikube: `minikube addons enable metrics-server`)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sprintboard
  namespace: sprintboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sprintboard
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
