apiVersion: v1
kind: ConfigMap
metadata:
  name: sprintboard-config
  namespace: sprintboard
data:
  PORT: "3000"
  PG_HOST: postgres
  PG_PORT: "5432"
  PG_DATABASE: sprintboard
  MONGO_URI: mongodb://mongo:27017/sprintboard
---
# Demo credentials - change before using anywhere real
apiVersion: v1
kind: Secret
metadata:
  name: sprintboard-secret
  namespace: sprintboard
type: Opaque
stringData:
  PG_USER: sprint
  PG_PASSWORD: change-me
