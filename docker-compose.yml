services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PG_HOST: postgres
      PG_USER: sprint
      PG_PASSWORD: sprint
      PG_DATABASE: sprintboard
      MONGO_URI: mongodb://mongo:27017/sprintboard
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    restart: on-failure

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sprint
      POSTGRES_PASSWORD: sprint
      POSTGRES_DB: sprintboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprint -d sprintboard"]
      interval: 5s
      retries: 12

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:
